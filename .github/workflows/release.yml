name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YuqueExporter_Windows_x64.zip
          - os: macos-latest
            artifact: YuqueExporter_macOS_arm64.zip
          - os: ubuntu-22.04
            artifact: YuqueExporter_Linux_x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Windows/macOS 用 setup-python（自带 tkinter）；Ubuntu 用系统 Python 配 apt 的 python3-tk
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'

      - name: Install tk (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-pip python3-tk python-is-python3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name YuqueExporter
          --collect-all markdownify --collect-all yaml --collect-all DrissionPage yuque_export.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/YuqueExporter.exe -DestinationPath ${{ matrix.artifact }}

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        run: cd dist && chmod +x YuqueExporter && zip ../${{ matrix.artifact }} YuqueExporter

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          append_body: true
