name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dist/YuqueExporter.exe
          - os: macos-latest
            asset: YuqueExporter.dmg
          - os: ubuntu-22.04
            asset: YuqueExporter.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Windows/macOS 用 setup-python（自带 tkinter）；Ubuntu 用系统 Python 配 apt 的 python3-tk
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'

      - name: Install tk (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-pip python3-tk python-is-python3

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      # Windows 打成单文件 exe；macOS/Linux 打成目录（.app / AppImage 需要目录结构）
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name YuqueExporter
          --collect-all markdownify --collect-all yaml --collect-all DrissionPage yuque_export.py

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: python -m PyInstaller --noconfirm --clean --windowed --name YuqueExporter
          --collect-all markdownify --collect-all yaml --collect-all DrissionPage yuque_export.py

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname YuqueExporter -srcfolder dist/YuqueExporter.app
          -ov -format UDZO YuqueExporter.dmg

      - name: Package .AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libfuse2
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          cp -r dist/YuqueExporter/* AppDir/usr/bin/
          printf '[Desktop Entry]\nType=Application\nName=Yuque Exporter\nExec=YuqueExporter\nIcon=YuqueExporter\nCategories=Utility;\nTerminal=false\n' \
            > AppDir/usr/share/applications/yuqueexporter.desktop
          python -m pip install pillow -q
          python -c "from PIL import Image; Image.new('RGB', (128, 128), (66, 133, 244)).save('AppDir/usr/share/icons/hicolor/128x128/apps/YuqueExporter.png')"
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir --output appimage
          # 输出名由 desktop 文件的 Name=Yuque Exporter 派生（空格转下划线）
          mv "Yuque_Exporter-x86_64.AppImage" YuqueExporter.AppImage

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
